family:
  - name: nordic_nrf
    series:
      - name: nrf54l
        socs:
          - name: nrf54lm20a
            cpuclusters:
              - name: cpuapp
              - name: cpuflpr
          - name: nrf54lm20b
            cpuclusters:
              - name: cpuapp
              - name: cpuflpr

# Recovery/erase is only needed once per core. Prevent resetting the cores whilst flashing
# multiple images until all images for each core have been flashed, this allows security
# bits to be set during programming without them interfering with additional flashing
# operations.
runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - qualifiers:
              - nrf54lm20a/cpuapp
              - nrf54lm20a/cpuflpr
          - qualifiers:
              - nrf54lm20b/cpuapp
              - nrf54lm20b/cpuflpr
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - qualifiers:
              - nrf54lm20a/cpuapp
              - nrf54lm20a/cpuflpr
          - qualifiers:
              - nrf54lm20b/cpuapp
              - nrf54lm20b/cpuflpr
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - qualifiers:
              - nrf54lm20a/cpuapp
              - nrf54lm20a/cpuflpr
